<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="João Franco — Full Stack Developer · Analista de Sistemas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset=".5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>

    <!-- brilho que atravessa o nome em loop -->
    <linearGradient id="shine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="translate(-700 0)">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".44" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#7fd6ea"/>
      <stop offset=".56" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-700 0;-700 0;700 0" keyTimes="0;.55;1" dur="6s" begin="2.4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <!-- ondas: só a borda inferior se move, o degradê fica parado -->
    <clipPath id="wave1">
      <path d="M0,0 L0,198 Q150,228 300,198 T600,198 T900,198 T1200,198 T1500,198 T1800,198 T2100,198 T2400,198 L2400,0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </clipPath>
    <clipPath id="wave2">
      <path d="M0,0 L0,214 Q150,184 300,214 T600,214 T900,214 T1200,214 T1500,214 T1800,214 T2100,214 T2400,214 L2400,0 Z">
        <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="17s" repeatCount="indefinite"/>
      </path>
    </clipPath>

    <style>
      .name {
        font: 700 78px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        letter-spacing: 1px;
        stroke: #9fdcea;
        stroke-width: 1.4;
        stroke-dasharray: 520;
        stroke-dashoffset: 0;
        fill-opacity: 1;
        stroke-opacity: .35;
        animation: draw 2.2s ease-in-out both, fill 1s ease-out 1.5s both;
      }
      .glow {
        font: 700 78px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        letter-spacing: 1px;
        fill: #5fc9e2;
        animation: pulse 4s ease-in-out 2.2s infinite both;
      }
      .sub {
        font: 500 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        letter-spacing: 5px;
        fill: #b9dde6;
        animation: rise .9s ease-out 2s both;
      }
      .line {
        stroke: #5fc9e2;
        stroke-width: 2;
        stroke-linecap: round;
        transform-origin: 600px 136px;
        animation: grow .8s ease-out 1.7s both;
      }
      .dot { fill: #cdeef6; animation: twinkle 3.2s ease-in-out infinite both; }

      @keyframes draw  { from { stroke-dashoffset: 520; stroke-opacity: 1; } to { stroke-dashoffset: 0; } }
      @keyframes fill  { from { fill-opacity: 0; stroke-opacity: 1; } to { fill-opacity: 1; stroke-opacity: .35; } }
      @keyframes pulse { 0%, 100% { opacity: .12; } 50% { opacity: .38; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes grow  { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: .8; } }
      @keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .85; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- fundo com duas camadas de onda (parallax) -->
  <rect width="1200" height="260" fill="url(#bg)" clip-path="url(#wave2)" opacity=".45"/>
  <rect width="1200" height="260" fill="url(#bg)" clip-path="url(#wave1)"/>

  <!-- partículas -->
  <g>
    <circle class="dot" cx="92"   cy="46"  r="1.6" style="animation-delay:0s"/>
    <circle class="dot" cx="188"  cy="118" r="1.2" style="animation-delay:1.1s"/>
    <circle class="dot" cx="276"  cy="62"  r="2"   style="animation-delay:2.3s"/>
    <circle class="dot" cx="344"  cy="150" r="1.3" style="animation-delay:.6s"/>
    <circle class="dot" cx="418"  cy="34"  r="1.5" style="animation-delay:1.7s"/>
    <circle class="dot" cx="786"  cy="40"  r="1.4" style="animation-delay:.3s"/>
    <circle class="dot" cx="852"  cy="152" r="1.8" style="animation-delay:2.6s"/>
    <circle class="dot" cx="930"  cy="74"  r="1.2" style="animation-delay:1.4s"/>
    <circle class="dot" cx="1016" cy="126" r="1.6" style="animation-delay:.9s"/>
    <circle class="dot" cx="1098" cy="52"  r="2"   style="animation-delay:2s"/>
    <circle class="dot" cx="1150" cy="140" r="1.2" style="animation-delay:.4s"/>
    <circle class="dot" cx="54"   cy="150" r="1.3" style="animation-delay:2.8s"/>
  </g>

  <!-- nome -->
  <text class="glow" x="600" y="112" text-anchor="middle" filter="url(#glow)">João Franco</text>
  <text class="name" x="600" y="112" text-anchor="middle" fill="url(#shine)">João Franco</text>

  <line class="line" x1="530" y1="136" x2="670" y2="136"/>

  <text class="sub" x="600" y="170" text-anchor="middle">FULL STACK DEVELOPER · ANALISTA DE SISTEMAS</text>
</svg>
